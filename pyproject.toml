[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kurolight"
version = "1.0.0"
description = "Intelligent Visual Creation & Photo Editing Engine"
authors = [
    { name = "KuroLabs" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "pywebview>=5.4.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0,<5",
    "onnxruntime-directml>=1.17.0; sys_platform == 'win32'",
    "pydantic>=2.0.0",
    "platformdirs>=3.0.0",
    "httpx>=0.25.0",
    "keyring>=24.0.0",
]

[project.optional-dependencies]
raw = [
    "rawpy>=0.19.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-asyncio>=0.23.0",
    "pyflakes>=3.2.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "coverage>=7.4.0",
]

[project.scripts]
kurolight     = "kurolight.main:main"
kurolight-gui = "kurolight.run_gui:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["src", "."]
